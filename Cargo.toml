[package]
name = "cstat"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
syn = { version = "2", features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
walkdir = "2"
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "=0.25.10"
tree-sitter-cpp = { path = "vendor/tree-sitter-cpp" }
globset = "0.4"
