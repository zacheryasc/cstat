[package]
name = "cstat-extract-rustc"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Nightly rustc_driver-driven extractor (out-of-process). Pinned via rust-toolchain.toml."

[[bin]]
name = "cstat-extract-rustc"
path = "src/main.rs"

[dependencies]
cstat-ir = { path = "../cstat-ir" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
